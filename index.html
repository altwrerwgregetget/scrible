<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skribbl.io Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://skribbl.io/" 
        title="Skribbl.io"
        sandbox="allow-scripts allow-same-origin allow-forms"
        referrerpolicy="no-referrer">
    </iframe>

</body>
</html>
